name: Publish PHASE release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install PS2EXE
        shell: powershell
        run: Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Compile PHASE installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\installer\compile-to-exe.ps1 -Force

      - name: Verify installer
        shell: powershell
        run: |
          if (-not (Test-Path .\installer\install-phase.exe)) {
            throw 'install-phase.exe was not generated.'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: phase-windows-installer
          path: installer/install-phase.exe
          if-no-files-found: error

  release:
    needs: windows-installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: phase-windows-installer
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PHASE v6.0
          body_path: RELEASE_NOTES.md
          files: release-assets/install-phase.exe
          fail_on_unmatched_files: true
          make_latest: true
