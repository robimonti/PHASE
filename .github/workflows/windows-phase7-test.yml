name: Build PHASE 7 Windows test installer

on:
  push:
    branches:
      - codex/phase-stamps-beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\installer\install-phase.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Install PS2EXE
        shell: powershell
        run: Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Compile Windows test installer
        shell: powershell
        env:
          PHASE_TEST_BRANCH: ${{ github.ref_name }}
        run: |
          powershell -ExecutionPolicy Bypass -File .\installer\compile-to-exe.ps1 -Force `
            -DefaultPhaseBranch $env:PHASE_TEST_BRANCH `
            -Output .\installer\install-phase7-test.exe
          if (-not (Test-Path .\installer\install-phase7-test.exe)) {
            throw 'Windows test installer was not generated.'
          }

      - name: Upload installer for guided test
        uses: actions/upload-artifact@v4
        with:
          name: phase7-windows-test-installer
          path: installer/install-phase7-test.exe
          if-no-files-found: error
          retention-days: 14
