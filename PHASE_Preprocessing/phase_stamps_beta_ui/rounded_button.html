<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
  button {
    box-sizing: border-box; width: 100%; height: 100%;
    border: 1px solid rgba(66, 109, 190, .17); border-radius: 13px;
    background: var(--bg, #edf3ff); color: var(--fg, #3565cf);
    font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    cursor: pointer; box-shadow: 0 3px 11px rgba(38, 87, 177, .07);
    transition: filter .14s ease, box-shadow .14s ease, transform .14s ease;
  }
  button:hover:not(:disabled) { filter: brightness(.985); box-shadow: 0 5px 14px rgba(38, 87, 177, .14); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid #3565cf; outline-offset: -3px; }
  button:disabled { cursor: default; opacity: .52; }
</style>
</head>
<body><button id="action" type="button"></button>
<script>
  function setup(htmlComponent) {
    const button = document.getElementById("action");
    let clickCount = 0;
    const update = () => {
      const data = htmlComponent.Data || {};
      button.textContent = data.label || "";
      button.style.setProperty("--bg", data.background || "#edf3ff");
      button.style.setProperty("--fg", data.foreground || "#3565cf");
      button.disabled = data.enabled === false;
      button.title = data.label || "";
    };
    button.addEventListener("click", () => {
      if (button.disabled) return;
      htmlComponent.Data = {...htmlComponent.Data, clicked: ++clickCount};
    });
    htmlComponent.addEventListener("DataChanged", update);
    update();
  }
</script>
</body>
</html>
